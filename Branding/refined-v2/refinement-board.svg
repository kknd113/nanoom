<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1330" viewBox="0 0 1600 1330"><title>Nanoom Held n — refined identity board</title><rect width="1600" height="1330" fill="#FAFBFC"/><text x="80" y="68" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#667586" letter-spacing="3">NANOOM / HELD N / REFINEMENT 02</text><text x="80" y="144" font-family="Helvetica,Arial,sans-serif" font-size="58" fill="#24354A" font-weight="500">A little closer.</text><text x="80" y="191" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#667586" >One person. A little space to be held.</text><rect x="80" y="242" width="350" height="350" rx="76" fill="#EAF0F8"/><g transform="translate(126 288) scale(2.015625)"><g fill="none" stroke="#4C6F9B" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"><path d="M35 92V39M35 61C35 27 93 27 93 61V92"/></g><circle cx="64" cy="76" r="7.25" fill="#4C6F9B"/></g><g transform="translate(525 319) scale(1.8)"><g fill="none" stroke="#24354A" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 74V28M6 46C6 18 54 18 54 46V74"/><circle cx="98" cy="50" r="24"/><path d="M122 26V74M146 74V28M146 46C146 18 194 18 194 46V74"/><circle cx="238" cy="50" r="24"/><circle cx="306" cy="50" r="24"/><path d="M354 74V28M354 46C354 18 398 18 398 46V74M398 46C398 18 442 18 442 46V74"/></g></g><text x="538" y="504" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#667586" >Life shared. Prayer together.</text><text x="538" y="552" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#667586" >An original outlined wordmark — no font dependency.</text><line x1="80" y1="650" x2="1520" y2="650" stroke="#DDE5EF"/><text x="80" y="710" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#667586" letter-spacing="2">THE REFINEMENT</text><g transform="translate(76 760) scale(1.4)"><g fill="none"><path d="M34 94V35M34 62C34 25 94 25 94 62V94" stroke="#4C6F9B" stroke-width="13" stroke-linecap="round"/><circle cx="64" cy="81" r="8" fill="#4C6F9B"/>
</g></g><text x="80" y="987" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#24354A" >01  Original</text><text x="80" y="1024" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#667586" >Heavier, taller, lower dot</text><g transform="translate(475 760) scale(1.4)"><g fill="none" stroke="#4C6F9B" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"><path d="M35 92V39M35 61C35 27 93 27 93 61V92"/></g><circle cx="64" cy="76" r="7.25" fill="#4C6F9B"/></g><text x="480" y="987" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#24354A" >02  Refined</text><text x="480" y="1024" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#667586" >Lighter stroke, closer dot, calmer arch</text><rect x="978" y="740" width="210" height="210" rx="46" fill="#1D2B3D"/><g transform="translate(1005 767) scale(1.22)"><g fill="none" stroke="#B5CBE6" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"><path d="M35 92V39M35 61C35 27 93 27 93 61V92"/></g><circle cx="64" cy="76" r="7.25" fill="#B5CBE6"/></g><text x="978" y="987" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#24354A" >Dark appearance</text><text x="1280" y="790" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#667586" >24</text><g transform="translate(1280 812) scale(.1875)"><g fill="none" stroke="#4C6F9B" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"><path d="M35 92V39M35 61C35 27 93 27 93 61V92"/></g><circle cx="64" cy="76" r="7.25" fill="#4C6F9B"/></g><text x="1350" y="790" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#667586" >32</text><g transform="translate(1350 808) scale(.25)"><g fill="none" stroke="#4C6F9B" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"><path d="M35 92V39M35 61C35 27 93 27 93 61V92"/></g><circle cx="64" cy="76" r="7.25" fill="#4C6F9B"/></g><text x="1434" y="790" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#667586" >48</text><g transform="translate(1434 800) scale(.375)"><g fill="none" stroke="#4C6F9B" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"><path d="M35 92V39M35 61C35 27 93 27 93 61V92"/></g><circle cx="64" cy="76" r="7.25" fill="#4C6F9B"/></g><text x="1280" y="920" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#667586" >Actual-size checks</text><line x1="80" y1="1090" x2="1520" y2="1090" stroke="#DDE5EF"/><text x="80" y="1156" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#667586" letter-spacing="2">THE MEANING</text><text x="80" y="1205" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#24354A" >The n carries the name. The dot carries the person.</text><text x="80" y="1252" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#667586" >A softer rhythm, a clearer silhouette, and room for the story inside.</text></svg>